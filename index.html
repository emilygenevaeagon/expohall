<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civic Connection 2026 | Expo Hall Explorer</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f6f7fb;overflow:hidden}
#expo{display:block;width:100%;height:100vh;border:0;background:#f6f7fb}
</style>
</head>
<body>
<iframe id="expo" src="expo.html" title="Civic Connection 2026 Expo Hall Explorer"></iframe>
<script>
const frame=document.getElementById('expo');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent=`
    .map{min-width:0!important;width:100%!important}
    .mapscroll{overflow:hidden!important;padding:12px!important}
    .map svg,.mapscroll svg{width:100%!important;height:auto!important;max-height:calc(100vh - 300px)!important;display:block!important;margin:0 auto!important}
    select,#filter,.categories,.category-menu,.category-list,.filter-menu,.saved,.savedlist,.savedhead{display:none!important}
    @media(max-width:1100px){
      .layout{grid-template-columns:1fr!important}
      .panel{position:static!important}
      .map svg,.mapscroll svg{max-height:none!important}
    }
    @media(max-width:650px){
      .mapscroll{padding:8px!important}
      .cardhead span{display:none!important}
    }
  `;
  d.head.appendChild(style);

  d.querySelectorAll('select,#filter,.categories,.category-menu,.category-list,.filter-menu,.saved,.savedlist,.savedhead').forEach(el=>el.remove());

  const intro=d.querySelector('.intro');
  if(intro) intro.textContent='Search for an exhibitor or select an occupied booth on the floor plan.';
});
</script>
</body>
</html>
