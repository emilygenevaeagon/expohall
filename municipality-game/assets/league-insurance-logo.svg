<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 343" role="img" aria-labelledby="title desc">
  <title id="title">League Insurance</title>
  <desc id="desc">League Insurance logo in gold and navy with a Wisconsin-inspired skyline and swoosh.</desc>
  <rect width="746" height="343" fill="white"/>

  <!-- LEAGUE wordmark -->
  <text x="0" y="194" fill="#FDB714" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-weight="700" letter-spacing="-5">LEAGUE</text>

  <!-- Skyline -->
  <g fill="#19286B">
    <rect x="515" y="88" width="28" height="58"/>
    <rect x="548" y="68" width="34" height="90"/>
    <polygon points="565,40 589,70 541,70"/>
    <rect x="589" y="39" width="42" height="138"/>
    <polygon points="589,39 631,31 631,39"/>
    <rect x="638" y="75" width="22" height="111"/>
    <polygon points="649,50 661,77 637,77"/>
    <rect x="667" y="102" width="29" height="99"/>
    <rect x="705" y="118" width="27" height="101"/>

    <!-- windows -->
    <rect x="522" y="105" width="5" height="10" fill="white"/>
    <rect x="534" y="101" width="5" height="10" fill="white"/>
    <rect x="555" y="91" width="5" height="12" fill="white"/>
    <rect x="570" y="84" width="5" height="12" fill="white"/>
    <rect x="603" y="63" width="6" height="14" fill="white"/>
    <rect x="617" y="57" width="6" height="14" fill="white"/>
    <rect x="644" y="105" width="5" height="11" fill="white"/>
    <rect x="676" y="132" width="5" height="11" fill="white"/>
    <rect x="686" y="126" width="5" height="11" fill="white"/>
    <rect x="713" y="145" width="5" height="11" fill="white"/>
  </g>

  <!-- Road / swoosh -->
  <path d="M470 126 C560 133 650 178 746 282" fill="none" stroke="#FDB714" stroke-width="13" stroke-linecap="round"/>
  <path d="M469 127 C563 145 648 194 746 322" fill="none" stroke="#FDB714" stroke-width="20" stroke-linecap="round"/>
  <path d="M476 127 C576 154 658 211 746 302" fill="none" stroke="#19286B" stroke-width="7" stroke-linecap="round"/>

  <!-- INSURANCE wordmark -->
  <text x="0" y="290" fill="#19286B" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="500" letter-spacing="17">INSURANCE</text>
</svg>
